[pytest]
# тесты: .venv/Scripts/python -m pytest (Windows) или .venv/bin/python -m pytest (Linux), см. README → «Тесты»
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# медленные тесты (обработка видео и т. п.) можно пропустить: pytest -m "not slow"
filterwarnings =
    # предупреждение внутри discord.py о Python 3.16 — не про код бота
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:discord
markers =
    slow: долгие тесты обработки картинок и видео
