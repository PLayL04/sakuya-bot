# Проверка на GitHub: при каждом пуше и pull request запускает тесты (python -m pytest) на чистой машине с Linux.
# Результат — значок у коммита: зелёная галочка или красный крестик (на него можно нажать и посмотреть, что упало).
# Ничего не публикует и на сервер с ботом не ставит; токен и другие секреты не нужны.
name: Тесты

on:
  push:
  pull_request:
  workflow_dispatch:  # кнопка «Run workflow» во вкладке Actions — запустить вручную

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: Запустить тесты
        run: python -m pytest -v
